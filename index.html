<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HugoClient – Official HugoSMP Fabric Client</title>
    <style>
        :root {
            --bg-dark: #111014;
            --card-bg: rgba(24, 22, 29, 0.88);
            --card-border: rgba(184, 173, 185, 0.14);
            --hugo-red: #A51222;
            --hugo-red-bright: #E52B3B;
            --hugo-violet: #38104F;
            --hugo-purple: #7826A6;
            --text-primary: #F5F0F5;
            --text-secondary: #B8ADB9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 12% 15%, rgba(165, 18, 34, 0.2), transparent 38%),
                radial-gradient(circle at 88% 45%, rgba(120, 38, 166, 0.18), transparent 42%),
                radial-gradient(circle at 25% 85%, rgba(56, 16, 79, 0.25), transparent 45%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1150px;
            margin: 0 auto;
            padding: 20px 20px;
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            background: rgba(17, 16, 20, 0.88);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .logo {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--hugo-red-bright), var(--hugo-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        /* Language Switcher */
        .lang-switch {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 11px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, var(--hugo-red-bright), var(--hugo-purple));
            color: #fff;
        }

        /* Hero Section */
        .hero {
            max-width: 1150px;
            margin: 70px auto 50px;
            padding: 0 20px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(229, 43, 59, 0.12);
            border: 1px solid rgba(229, 43, 59, 0.4);
            color: var(--hugo-red-bright);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 22px;
        }

        .hero h1 {
            font-size: 3.3rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 18px;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1.15rem;
            max-width: 660px;
            margin: 0 auto 36px;
        }

        .cta-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            padding: 15px 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--hugo-red-bright), var(--hugo-purple));
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 25px rgba(229, 43, 59, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(229, 43, 59, 0.42);
        }

        .btn-secondary {
            padding: 15px 28px;
            border-radius: 10px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            transition: border-color 0.2s, background 0.2s;
        }

        .btn-secondary:hover {
            border-color: var(--hugo-purple);
            background: rgba(120, 38, 166, 0.16);
        }

        /* Stats Strip */
        .stats-bar {
            max-width: 950px;
            margin: 50px auto 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            padding: 0 20px;
        }

        .stat-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
        }

        .stat-item strong {
            display: block;
            font-size: 1.35rem;
            color: var(--text-primary);
        }

        .stat-item span {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* Sections */
        .section {
            max-width: 1150px;
            margin: 85px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .section-sub {
            color: var(--text-secondary);
            margin-bottom: 36px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-top: 2px solid var(--hugo-red-bright);
            border-radius: 14px;
            padding: 26px;
            backdrop-filter: blur(12px);
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--hugo-purple);
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Installation Steps */
        .steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .step-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 24px;
        }

        .step-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--hugo-red-bright), var(--hugo-purple));
            font-weight: 800;
            font-size: 0.9rem;
            margin-bottom: 14px;
        }

        /* FAQ */
        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        details {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 18px 22px;
            cursor: pointer;
        }

        summary {
            font-weight: 700;
            font-size: 1.05rem;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        summary::after {
            content: "+";
            color: var(--hugo-red-bright);
            font-size: 1.3rem;
            font-weight: 800;
        }

        details[open] summary::after {
            content: "−";
        }

        details p {
            margin-top: 12px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Community / Social Box */
        .community-box {
            background: linear-gradient(135deg, rgba(165, 18, 34, 0.16), rgba(56, 16, 79, 0.28));
            border: 1px solid rgba(120, 38, 166, 0.4);
            border-radius: 16px;
            padding: 44px 24px;
            text-align: center;
        }

        .community-box h2 {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .community-box p {
            color: var(--text-secondary);
            margin-bottom: 26px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Footer */
        footer {
            max-width: 1150px;
            margin: 60px auto 0;
            padding: 30px 20px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
